name: StressLens CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Production & ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django Configuration
        run: |
          python manage.py check

      - name: Run Django Application Test Suite
        run: |
          python manage.py test

      - name: Run Standalone ML Pipeline Unit Tests
        run: |
          python -m unittest tests/test_ml.py
